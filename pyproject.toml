[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rotocraft"
version = "0.1.0"
description = "AI-powered automatic rotoscoping and object masking tool for FilmCraft"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "FilmCraft Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "onnxruntime>=1.16.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=9.5.0",
    "click>=8.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.16.0",
]
sam2 = [
    "sam2 @ git+https://github.com/facebookresearch/segment-anything-2.git",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
rotocraft = "rotocraft.cli:main"

[project.urls]
Homepage = "https://github.com/Sarthaksenpai7xd/rotocraft"
Repository = "https://github.com/Sarthaksenpai7xd/rotocraft"
Issues = "https://github.com/Sarthaksenpai7xd/rotocraft/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["rotocraft*"]
